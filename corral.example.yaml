# Corral configuration example. Copy to corral.yaml and edit.
# Secrets are NOT stored here — set them as environment variables (BYOK):
#   CORRAL_NOTION_DEFAULT     — Notion integration token
#   CORRAL_GITHUB_SERVER      — GitHub token for the repo whose key is "server"
#   CORRAL_GITHUB_APP         — GitHub token for the repo whose key is "app"
#   CORRAL_ANTHROPIC_DEFAULT  — Anthropic API key
# (the var name is CORRAL_<SERVICE>_<ACCOUNT>, uppercased; per-repo creds use the
#  repo's key as the account, so each repo can carry its own token.)

profile:
  language: en          # output language for agent-authored plans/reviews
  stack: generic        # review calibration profile
  # Optional read-only conventions/skills repo cloned beside your repos (agent consults it).
  # reference_repo: acme/conventions          # "owner/name" or a full https URL
  # reference_credential: { service: reference, account: default }   # only if private → CORRAL_REFERENCE_DEFAULT

tracker:
  kind: notion
  database_id: "your_notion_database_id"
  credential: { service: notion, account: default }
  properties:
    status: "Status"
    identifier: "ID"
    repo: "Repo"
  states:
    # Only these 3 are required (entry / working / terminal). On a coarse board,
    # drop plan_review + in_review and they collapse onto planning / in_progress.
    planning: "Backlog"
    in_progress: "In progress"
    done: "Done"
    # plan_review: "Plan review"   # optional refinement
    # in_review: "In review"       # optional refinement
  scope:
    # checkbox | select | multi_select | status. `select`/`multi_select`/`status` take a
    # `values: [...]` list instead; this one picks up issues whose checkbox is ticked.
    type: checkbox
    property: "Corral"

# All repos are cloned side by side into the workspace (each under its <key>/).
# The agent reads `description` to decide which repo(s) an issue touches, changes
# only those, and the orchestrator opens one PR per changed repo.
repositories:
  - kind: github
    key: server
    repo: acme/widgets-server
    description: "NestJS backend API (auth, REST, MongoDB)"
    credential: { service: github, account: server }   # → CORRAL_GITHUB_SERVER
    branch_strategy:
      production: main
      development: develop
    verify:
      - "npm run lint"
      - "npm run typecheck"
    after_clone: "npm ci"
  - kind: github
    key: app
    repo: acme/widgets-app
    description: "Flutter mobile app (iOS + Android)"
    credential: { service: github, account: app }       # → CORRAL_GITHUB_APP
    branch_strategy:
      production: main
      development: develop
    after_clone: "flutter pub get"

agent:
  provider: claude        # claude | gemini | gpt
  transport: cli          # cli (spawns your installed CLI) | api (official SDK, your key)
  credential: { service: anthropic, account: default }  # API key injected as ANTHROPIC_API_KEY (BYOK)
  models:
    planning: opus
    implementation: sonnet
    review: opus

workspace:
  backend: local          # local | docker
  # docker backend: a worker image is auto-built from your repos' manifests unless you
  # set `image`. Requires Docker installed.
  # docker:
  #   # image: my-worker:latest   # BYO image (skips auto-build)
  #   auto_build: true            # analyze repos → generate Dockerfile → build (default)
  #   mount_host_login: true      # mount ~/.claude into the container (no API key needed).
  #                               # set false to authenticate with an agent API key instead.

# Daily ceiling, SHARED by the development and operational AI (first come, first served —
# when the day's budget is gone, both stop). The token counts are the figure of record:
# they come back from the response itself and are exactly what was spent, while a price
# table belongs to the vendor and the vendor changes it. `daily_cost_usd` is estimated
# from that table — a guard rail in the unit you actually budget in, not an invoice.
# Set any of the three on its own; whichever runs out first stops the work.
# Omit for no ceiling.
# limits:
#   daily_input_tokens: 2000000
#   daily_output_tokens: 200000
#   daily_cost_usd: 20

channel:
  kind: web               # the app itself is the channel — no port, nothing to open.

# How the desktop app reaches a core running somewhere else. Off by default: the app forks
# the core itself for a single-machine install. Binding stays on loopback because the plane
# is authenticated but NOT encrypted — the app opens an SSH tunnel to carry it.
# The `--control-plane [host:]port` flag overrides this for one run.
# control_plane:
#   enabled: true
#   host: 127.0.0.1
#   port: 4410

# Issues worked on at once. Each gets its own workspace, so this is disk and CPU as much
# as it is money.
# max_active_issues: 3

# Self-review after implementation. `rounds` are independent passes (fresh session each).
# `max_fix_rounds: 0` means review runs once and then a human decides — auto-fixing costs
# Opus output twice over, which was the expensive part.
# review:
#   rounds: 1
#   max_fix_rounds: 0
#   auto_pr_when_clean: false
#   semgrep: { config: ["p/default"], paths: ["."] }   # omit to skip; detected on PATH

# Independent critics vetting the plan before you see it.
# plan_review:
#   enabled: true
#   rounds: 1
#   heavy_labels: []      # labels that get `heavy_rounds` instead
#   heavy_rounds: 2

# `single` = one plan document, approved once (default). `split` = the three spec gates
# (requirements → design → tasks), each approved on its own. Roughly 2.4x the model calls
# per issue, and the daily ceiling is shared with the operational AI — hence the default.
# spec_mode: single
