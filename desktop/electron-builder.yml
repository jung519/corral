appId: dev.corral.app
productName: Corral
directories:
  output: release
# The Electron app itself = the compiled main/preload.
files:
  - dist/**
  - package.json
# The headless core (run as a child node process) + the built renderer are shipped
# as resources. The core needs its runtime node_modules (zod/yaml/liquidjs/marked).
extraResources:
  - from: ../dist
    to: core/dist
  - from: ../package.json
    to: core/package.json
  - from: ../node_modules
    to: core/node_modules
  - from: ../renderer/dist
    to: renderer
  - from: ../WORKFLOW.md
    to: core/WORKFLOW.md
  # MIT/ISC 는 바이너리 배포에도 라이선스 전문과 저작권 표시를 함께 요구한다.
  # `pnpm package` 가 빌드 전에 이 파일을 다시 만든다 (CRL-118).
  - from: ../THIRD-PARTY-LICENSES.txt
    to: THIRD-PARTY-LICENSES.txt
mac:
  category: public.app-category.developer-tools
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
# No proprietary binaries are bundled (BYOK; provider CLIs are detected, not shipped).
